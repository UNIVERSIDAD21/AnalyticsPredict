version: "3.9"

services:
  analytics-backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    container_name: analytics-backend-staging
    env_file:
      - ./staging.env
    ports:
      - "${STAGING_BACKEND_PORT:-18000}:8000"
    restart: unless-stopped

  analytics-frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile
    container_name: analytics-frontend-staging
    depends_on:
      - analytics-backend
    ports:
      - "${STAGING_FRONTEND_PORT:-15173}:80"
    restart: unless-stopped

