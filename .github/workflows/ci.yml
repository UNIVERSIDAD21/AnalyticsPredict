name: CI

on:
  push:
    branches: ["main", "reactivacion/implementacion-single-user"]
  pull_request:
    branches: ["main", "reactivacion/implementacion-single-user"]

jobs:
  backend-unit-and-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Unitarias analíticas sin BD
        run: >-
          python -m pytest -q
          tests/test_walk_forward.py
          tests/test_futbol_walkforward_scorecard.py
          tests/test_futbol_madurez_beta.py
          tests/test_selector_calibrador.py
          tests/test_futbol_readiness_gate_b18.py
          tests/test_nba_ganador_probable.py
          tests/test_metricas_1x2_futbol.py
          tests/test_auditar_corte_analitico.py
          tests/calidad/test_reglas_single_user.py
          tests/test_actualizar_partidos_nba.py

      - name: Contratos API sin BD
        run: >-
          python -m pytest -q
          tests/test_rutas_bitacora_payload.py
          tests/api/test_bitacora_contract.py
          tests/api/test_apuestas_futbol_contract.py
          tests/api/test_single_user_contract.py
          tests/test_smoke_api.py

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Dependencias de producción sin vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        run: npm run build

  postgres-migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics_test
          POSTGRES_PASSWORD: analytics_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics_test -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_PG_ADMIN_URL: postgresql://analytics_test:analytics_test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar driver y pytest
        run: python -m pip install -r backend/requirements.lock
      - name: Migración single-user en base efímera
        working-directory: backend
        run: python -m pytest -q tests/integracion/test_migracion_single_user_pg.py
      - name: Suite backend global con base efímera sintética
        working-directory: backend
        run: python scripts/run_suite_global_testdb.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir y arrancar Compose contra PostgreSQL desechable
        run: |
          printf 'ENTORNO=desarrollo\nDEBUG=false\nHOST=0.0.0.0\nPUERTO=8000\nSTAGING_BACKEND_PORT=18000\nSTAGING_FRONTEND_PORT=15173\nDATABASE_URL=postgresql://analytics_test:analytics_test@analytics-postgres-test:5432/analytics_test?sslmode=disable\n' > deploy/staging/staging.env
          trap 'docker compose -f deploy/staging/docker-compose.yml -f deploy/staging/docker-compose.ci.yml --env-file deploy/staging/staging.env down --volumes; rm -f deploy/staging/staging.env' EXIT
          docker compose -f deploy/staging/docker-compose.yml -f deploy/staging/docker-compose.ci.yml --env-file deploy/staging/staging.env config --quiet
          docker compose -f deploy/staging/docker-compose.yml -f deploy/staging/docker-compose.ci.yml --env-file deploy/staging/staging.env up -d --build --wait
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/openapi.json > /tmp/analytics-openapi.json && curl --fail --silent http://127.0.0.1:15173/ > /tmp/analytics-front.html; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = json.loads(Path('/tmp/analytics-openapi.json').read_text())['paths']
          assert '/salud' in paths
          assert not any(p.startswith(('/api/auth', '/api/pagos', '/api/premium')) for p in paths)
          assert '<html' in Path('/tmp/analytics-front.html').read_text().lower()
          PY
          curl --fail --silent http://127.0.0.1:18000/salud > /dev/null
          test "$(docker inspect -f '{{range .NetworkSettings.Ports}}{{range .}}{{.HostIp}} {{end}}{{end}}' analytics-backend-staging | xargs)" = "127.0.0.1"
          test "$(docker inspect -f '{{range .NetworkSettings.Ports}}{{range .}}{{.HostIp}} {{end}}{{end}}' analytics-frontend-staging | xargs)" = "127.0.0.1"
