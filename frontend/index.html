<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AnalyticsPredict: herramienta personal de análisis deportivo, NBA, fútbol y trazabilidad." />
    <meta name="theme-color" content="#0a0a0f" />

    <script>
      try {
        const p = JSON.parse(localStorage.getItem('analyticspredict-visual-v1') || '{}');
        document.documentElement.dataset.tema = p.tema === 'claro' ? 'claro' : 'oscuro';
        document.documentElement.dataset.densidad = p.densidad === 'compacta' ? 'compacta' : 'comoda';
        document.documentElement.dataset.texto = p.texto === 'grande' ? 'grande' : 'normal';
      } catch (_) { /* El tema predeterminado no requiere almacenamiento. */ }
    </script>

    <title>AnalyticsPredict</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
